[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihatepdf"
version = "0.2.0"
description = "IhatePDF: local PDF tools with a minimal Python web interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.26.7,<2", "Pillow>=10,<13", "Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ihatepdf = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

